# cargo-about: the licenses Upleveler's binaries may include, most preferred
# first (for "A OR B" crates the first accepted one is used). The release
# workflow renders THIRD-PARTY-LICENSES.txt from this and third-party.hbs.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Crates that are not published (the site) are not shipped in the binary.
private = { ignore = true }
workarounds = ["ring", "rustls"]
