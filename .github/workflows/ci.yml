name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The site builds the app crate without the server; keep that build clean too.
      - run: cargo clippy --locked -p upleveler --no-default-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  install:
    name: Install on the minimum Rust (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pass the version as an input: a version-like @ref would be "updated" by Dependabot.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
      - uses: Swatinem/rust-cache@v2
      # The exact command the README tells users to run.
      - run: cargo install --path crates/upleveler --locked --root "$RUNNER_TEMP/upleveler"
      - run: |
          "$RUNNER_TEMP/upleveler/bin/upleveler" --version
          UPLEVELER_HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/upleveler/bin/upleveler" status
